<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>EPROLO · 30s Motion Board</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0a1512;overflow:hidden;
    font-family:"Inter","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{width:100%;height:100%;object-fit:contain;display:block}
  #hud{position:fixed;left:0;right:0;bottom:0;padding:14px 22px 16px;
    background:linear-gradient(to top,rgba(6,16,13,.92),rgba(6,16,13,0));
    opacity:.25;transition:opacity .25s;color:#cfe8d8}
  #hud:hover{opacity:1}
  .row{display:flex;align-items:center;gap:14px}
  #play{width:34px;height:34px;border-radius:50%;border:0;background:#32ca49;color:#04220f;
    font-size:13px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto}
  #bar{position:relative;flex:1;height:6px;border-radius:3px;background:#1d3a2c;cursor:pointer}
  #fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:#32ca49;width:0}
  #marks{position:absolute;inset:0}
  .mk{position:absolute;top:-3px;bottom:-3px;width:1px;background:rgba(255,255,255,.28)}
  #time{font-variant-numeric:tabular-nums;font-size:12px;opacity:.8;min-width:88px;text-align:right}
  #chapters{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
  #chapters button{background:rgba(255,255,255,.07);border:0;color:#a9c9b8;font-size:11px;
    padding:4px 9px;border-radius:20px;cursor:pointer;letter-spacing:.02em}
  #chapters button:hover{background:rgba(50,202,73,.22);color:#e6fff0}
  #hint{position:fixed;top:16px;left:22px;color:#53756a;font-size:11px;letter-spacing:.06em;
    opacity:.5;pointer-events:none}
</style>
</head>
<body>
<div id="hint">EPROLO · MOTION BOARD v1 · 16:9 · 30s</div>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>

<div id="hud">
  <div class="row">
    <button id="play">▶</button>
    <div id="bar"><div id="fill"></div><div id="marks"></div></div>
    <div id="time">0.00 / 30.03</div>
  </div>
  <div id="chapters"></div>
</div>

<!-- 录屏原件保留在 assets/，本稿使用静帧 + 缓慢推近，避免裁切后画面滚动过快 -->

<script>
const W=1920,H=1080,END=30.033;
const c=document.getElementById('c'), ctx=c.getContext('2d');
ctx.imageSmoothingQuality='high';

/* ---------- palette ---------- */
const G={ a:'#3DE06D', b:'#16A24F', c:'#0A6B36', d:'#05301E',
  ink:'#0A2A1B', ink2:'#3D5A4C', muted:'#7C938A', line:'#E2EAE4',
  light:'#EFF3EE', paper:'#FFFFFF', warm:'#F7F9F6' };

/* ---------- utils ---------- */
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ph=(t,a,b)=>clamp((t-a)/(b-a));
const eOutC=t=>1-Math.pow(1-t,3);
const eOutQ=t=>1-Math.pow(1-t,4);
const eInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eOutBack=t=>{const s=1.70158;return 1+ (s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2)};
const eOutExpo=t=>t>=1?1:1-Math.pow(2,-10*t);
const eInQuad=t=>t*t;
const lerpC=(c1,c2,t)=>{
  const p=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const A=p(c1),B=p(c2);
  return `rgb(${Math.round(lerp(A[0],B[0],t))},${Math.round(lerp(A[1],B[1],t))},${Math.round(lerp(A[2],B[2],t))})`;
};

function R(x,y,w,h,fill,r=0,alpha=1){
  ctx.save(); ctx.globalAlpha*=alpha; ctx.fillStyle=fill;
  ctx.beginPath();
  if(r) ctx.roundRect(x,y,w,h,r); else ctx.rect(x,y,w,h);
  ctx.fill(); ctx.restore();
}
function stroke(x,y,w,h,col,lw=1,r=0,alpha=1){
  ctx.save(); ctx.globalAlpha*=alpha; ctx.strokeStyle=col; ctx.lineWidth=lw;
  ctx.beginPath();
  if(r) ctx.roundRect(x,y,w,h,r); else ctx.rect(x,y,w,h);
  ctx.stroke(); ctx.restore();
}
function text(s,x,y,size,col,o={}){
  const {weight=700,align='left',italic=false,alpha=1,ls=0,family='Inter,"Helvetica Neue",Arial,sans-serif',base='alphabetic'}=o;
  ctx.save(); ctx.globalAlpha*=alpha; ctx.fillStyle=col; ctx.textAlign=align; ctx.textBaseline=base;
  ctx.font=`${italic?'italic ':''}${weight} ${size}px ${family}`;
  if('letterSpacing' in ctx) ctx.letterSpacing=ls+'px';
  ctx.fillText(s,x,y); ctx.restore();
}
function head(s,x,y,size,col,o={}){ text(s,x,y,size,col,{italic:true,weight:900,ls:-size*0.03,family:'Arial Black,Arial,sans-serif',...o}); }
function glow(x,y,r,col,alpha=0.5){
  const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,col); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.save(); ctx.globalAlpha*=alpha; ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); ctx.restore();
}
function shadow(x,y,w,h,r,blur=50,alpha=.16,dy=18){
  ctx.save(); ctx.shadowColor=`rgba(4,40,24,${alpha})`; ctx.shadowBlur=blur; ctx.shadowOffsetY=dy;
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill(); ctx.restore();
}
function arc(cx,cy,r,a0,a1,lw,col,alpha=1){
  ctx.save(); ctx.globalAlpha*=alpha; ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(cx,cy,r,a0,a1); ctx.stroke(); ctx.restore();
}
function imgFit(im,x,y,w,h,r=0,scale=1){
  if(!im||!im.complete||!im.naturalWidth) return;
  ctx.save(); ctx.beginPath(); r?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h); ctx.clip();
  const ir=im.naturalWidth/im.naturalHeight, br=w/h;
  let dw,dh;
  if(ir>br){ dw=w*scale; dh=dw/ir*1; } else { dh=h*scale; dw=dh*ir; }
  if(dh<h&&ir>br){ dh=h*scale; dw=dh*ir; }
  if(dw<w&&ir<=br){ dw=w*scale; dh=dw/ir; }
  ctx.drawImage(im,x+(w-dw)/2,y+(h-dh)/2,dw,dh);
  ctx.restore();
}
function imgContain(im,x,y,w,h,alpha=1){
  if(!im||!im.naturalWidth) return;
  const ir=im.naturalWidth/im.naturalHeight, br=w/h;
  let dw,dh;
  if(ir>br){ dw=w; dh=w/ir; } else { dh=h; dw=h*ir; }
  ctx.save(); ctx.globalAlpha*=alpha;
  ctx.drawImage(im,x+(w-dw)/2,y+(h-dh)/2,dw,dh); ctx.restore();
}
function vFit(v,x,y,w,h,r=0,scale=1,fx=.5,fy=.5,fallback=null){
  const live = v && v.readyState>=2;
  const src = live? v : fallback;
  if(!src) return;
  const sw = live? v.videoWidth : src.naturalWidth;
  const sh = live? v.videoHeight : src.naturalHeight;
  if(!sw||!sh) return;
  ctx.save(); ctx.beginPath(); r?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h); ctx.clip();
  const ir=sw/sh, br=w/h;
  let dw,dh;
  if(ir>br){ dh=h; dw=h*ir; } else { dw=w; dh=w/ir; }
  dw*=scale; dh*=scale;
  ctx.drawImage(src, x+(w-dw)*fx, y+(h-dh)*fy, dw, dh);
  ctx.restore();
}
function check(x,y,s,col){
  ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=s*.22; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(x-s*.32,y); ctx.lineTo(x-s*.05,y+s*.28); ctx.lineTo(x+s*.34,y-s*.3); ctx.stroke(); ctx.restore();
}
function cursor(x,y,col='#0A2A1B',alpha=1,s=1){
  ctx.save(); ctx.globalAlpha*=alpha; ctx.translate(x,y); ctx.scale(s,s);
  ctx.fillStyle=col; ctx.strokeStyle='#fff'; ctx.lineWidth=2.2; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,30); ctx.lineTo(7.5,23); ctx.lineTo(13,35);
  ctx.lineTo(18,32.5); ctx.lineTo(12.6,21); ctx.lineTo(22,20); ctx.closePath();
  ctx.fill(); ctx.stroke(); ctx.restore();
}

/* ---------- assets ---------- */
const IM={};
const WALL_SRC=Array.from({length:16},(_,i)=>'wall/w'+String(i+1).padStart(2,'0')+'.png');
const P=[ 'assets/p/1.png','assets/p/2.png','assets/p/3.png','assets/p/m1.png','assets/p/m2.png','assets/p/m3.png',
  'assets/icons/shopify.png','assets/icons/tiktok.png','assets/icons/ebay.png','assets/icons/amazon.png',
  'assets/icons/etsy.png','assets/icons/woocommerce.png','assets/plate-a.png','assets/plate-b.png','assets/plate-row.png',
  'panels/p0.70.png','panels/p1.50.png','panels/p2.20.png', ...WALL_SRC ];
P.forEach(s=>{ const i=new Image(); i.src=s; IM[s]=i; });
const MARK=new Image(); MARK.src='brand/mark.png';
const LOCKUP=new Image(); LOCKUP.src='brand/lockup.png';
const LOCKUPP=new Image(); LOCKUPP.src='brand/lockup-plain.png';

/* ---------- brand mark (真实 logo 染色绘制) ---------- */
const _tintCache=new Map();
function tint(img,color){
  if(!img.naturalWidth) return null;
  const key=img.src+'|'+color;
  if(_tintCache.has(key)) return _tintCache.get(key);
  const cv=document.createElement('canvas');
  cv.width=img.naturalWidth; cv.height=img.naturalHeight;
  const g=cv.getContext('2d');
  g.drawImage(img,0,0);
  g.globalCompositeOperation='source-in';
  g.fillStyle=color; g.fillRect(0,0,cv.width,cv.height);
  _tintCache.set(key,cv);
  return cv;
}
/* 方形图标：以 (x,y) 为中心，边长 s */
function logoMark(x,y,s,color='#fff',alpha=1){
  const t=tint(MARK,color); if(!t) return;
  ctx.save(); ctx.globalAlpha*=alpha;
  ctx.drawImage(t,x-s/2,y-s/2,s,s); ctx.restore();
}
/* 横版 lockup：以 (x,y) 为中心，宽度 w */
function logoLockup(x,y,w,color,alpha=1,src=LOCKUP){
  const t=tint(src,color); if(!t) return;
  const h=w*src.naturalHeight/src.naturalWidth;
  ctx.save(); ctx.globalAlpha*=alpha;
  ctx.drawImage(t,x-w/2,y-h/2,w,h); ctx.restore();
}
function logoWord(x,y,w,color,alpha=1){ logoLockup(x,y,w,color,alpha,LOCKUPP); }

/* ---------- timeline ---------- */
const S=[
  {t:0,     n:'品牌开场'},
  {t:1.60,  n:'渠道'},
  {t:4.40,  n:'后台'},
  {t:8.60,  n:'能力环'},
  {t:9.60,  n:'批量上架'},
  {t:14.20, n:'寻源'},
  {t:18.00, n:'利润'},
  {t:22.00, n:'贴牌'},
  {t:27.00, n:'协作'},
  {t:29.20, n:'收尾'},
];

/* ---------- shared backgrounds ---------- */
function bgGradient(t, warm=0){
  const g=ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,G.c); g.addColorStop(.45,G.b); g.addColorStop(1,'#0B7A42');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  glow(lerp(560,760,Math.sin(t*.5)*.5+.5), 340, 720, 'rgba(90,255,150,.30)', .9);
  glow(1500, 880, 640, 'rgba(0,60,30,.55)', .8);
  // faint ring motif
  ctx.save(); ctx.globalAlpha=.07;
  for(let i=0;i<3;i++) arc(960,540, 420+i*180, t*.4+i*1.1, t*.4+i*1.1+2.2, 2.4, '#ffffff');
  ctx.restore();
}
function bgLight(t){
  ctx.fillStyle=G.light; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.globalAlpha=.55;
  const g=ctx.createRadialGradient(960,300,80,960,600,1200);
  g.addColorStop(0,'#FFFFFF'); g.addColorStop(1,G.light);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H); ctx.restore();
  ctx.save(); ctx.globalAlpha=.34; ctx.strokeStyle='#DDE7DF'; ctx.lineWidth=1;
  for(let x=0;x<=W;x+=80){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=0;y<=H;y+=80){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  ctx.restore();
  // 品牌后置字：贴在右下角、完整可读、极淡，永远在内容层之下
  ctx.save();
  ctx.globalAlpha=.032;
  ctx.translate(1430+Math.sin(t*.16)*10, 1012);
  ctx.rotate(-.018);
  ctx.fillStyle=G.b; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.font='italic 900 268px Arial Black,Arial,sans-serif';
  if('letterSpacing' in ctx) ctx.letterSpacing='-9px';
  ctx.fillText('eprolo',0,0);
  ctx.restore();
  glow(280,180,520,'rgba(50,202,73,.10)',1);
  glow(1700,940,560,'rgba(50,202,73,.08)',1);
}

/* ---------- wordmark ---------- */
function wordmark(x,y,size,col,alpha=1){
  ctx.save(); ctx.globalAlpha*=alpha;
  ctx.font=`italic 900 ${size}px Arial Black,Arial,sans-serif`;
  if('letterSpacing' in ctx) ctx.letterSpacing=(-size*.035)+'px';
  ctx.fillStyle=col; ctx.textBaseline='alphabetic';
  const w=ctx.measureText('EPROLO').width;
  ctx.fillText('EPROLO',x-w/2,y);
  ctx.restore();
  return w;
}
function epMark(x,y,s,alpha=1,col='#fff'){
  logoMark(x,y,s*.80,col,alpha);
}

/* ================= SCENES ================= */

/* 0 — brand open */
function sBrand(t){
  bgGradient(t);
  // 真字标：沿书写方向自左向右擦出，比逐字浮起更贴合品牌本身的笔势
  const lw=1180, lh=lw*250/1011;
  const lx=960-lw/2, ly=548-lh/2;
  const t2=tint(LOCKUPP,'#FFFFFF');
  if(t2){
    const rev=eOutC(ph(t,.06,.94));
    const rise=(1-eOutQ(ph(t,0,1.1)))*14;
    ctx.save();
    ctx.globalAlpha=clamp(rev*3.2);
    ctx.beginPath(); ctx.rect(lx-8, ly-12+rise, (lw+16)*rev, lh+24); ctx.clip();
    ctx.drawImage(t2, lx, ly+rise, lw, lh);
    ctx.restore();
  }
  const q=eOutC(ph(t,.72,1.36));
  text('SUPPLY CHAIN, BUILT FOR YOUR BRAND',960,772,25,'rgba(255,255,255,'+(q*.88)+')',
    {align:'center',weight:600,ls:6});
  ctx.save(); ctx.globalAlpha=q;
  R(760,812,400,2,'rgba(255,255,255,.45)'); ctx.restore();
}

/* 1 — channels */
function sChannels(t){
  bgLight(t);
  const a=eOutC(ph(t,1.6,2.25));
  head('One catalog.',960,315,104,G.ink,{align:'center',alpha:a});
  head('Every channel.',960,428,104,G.b,{align:'center',alpha:eOutC(ph(t,1.8,2.45))});
  const q=eOutC(ph(t,2.15,2.75));
  text('List once. Sell where your buyers already are.',960,494,27,G.ink2,{align:'center',weight:500,alpha:q});

  const logos=[['assets/icons/shopify.png',148],['assets/icons/tiktok.png',148],['assets/icons/ebay.png',106],
    ['assets/icons/amazon.png',148],['assets/icons/etsy.png',100],['assets/icons/woocommerce.png',176]];
  const n=logos.length, cw=204, gap=28, totalW=n*cw+(n-1)*gap;
  let x0=960-totalW/2;
  const baseY=700;
  logos.forEach((L,i)=>{
    const p=eOutBack(clamp((t-2.4-i*.08)/.62));
    const x=x0+i*(cw+gap), y=baseY+(1-p)*90;
    ctx.save(); ctx.globalAlpha*=clamp((t-2.4-i*.08)/.3);
    shadow(x,y,cw,124,18,34,.13,16);
    R(x,y,cw,124,'#fff',18);
    imgContain(IM[L[0]],x+22,y+38,cw-44,48);
    ctx.restore();
  });
  const q3=eOutC(ph(t,3.05,3.75));
  text('Native sync · no setup fee · no membership fee',960,886,22,G.ink2,{align:'center',weight:600,alpha:q3});
}

/* app window chrome */
function appWindow(x,y,w,h,alpha=1,tabs=['Products','Sourcing','Orders','Branding'],active=0){
  ctx.save(); ctx.globalAlpha*=alpha;
  shadow(x,y,w,h,22,70,.20,26);
  R(x,y,w,h,'#fff',22);
  // top bar
  ctx.save(); ctx.beginPath(); ctx.roundRect(x,y,w,h,22); ctx.clip();
  R(x,y,w,66,'#fff');
  ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.moveTo(x,y+66); ctx.lineTo(x+w,y+66);
  ctx.strokeStyle=G.line; ctx.lineWidth=1.5; ctx.stroke(); ctx.restore();
  logoWord(x+96,y+33,140,G.ink);
let tx=x+196;
  tabs.forEach((tb,i)=>{
    const on=i===active;
    ctx.save();
    ctx.font=`${on?700:500} 15px Inter,"Helvetica Neue",Arial,sans-serif`;
    const tw2=ctx.measureText(tb).width;
    ctx.restore();
    text(tb,tx,y+41,15,on?G.b:G.muted,{weight:on?700:500});
    if(on) R(tx,y+54,tw2,2.5,G.a);
    tx+=tw2+40;
  });
  R(x+w-176,y+18,100,30,'#EAF7EE',15);
  text('Free plan',x+w-126,y+38,13,G.b,{align:'center',weight:700});
  ctx.beginPath(); ctx.arc(x+w-46,y+33,15,0,7); ctx.fillStyle='#E7EFE9'; ctx.fill();
  text('A',x+w-46,y+39,13,G.ink2,{align:'center',weight:700});
  ctx.restore();
}

/* 2 — backend window · 商品墙极速下滑（变速 / 动态模糊 / 推近）
   素材：从录屏中按卡片网格精确裁切的 16 个真实商品卡（wall/w01..16.png），
   在离屏画布上拼成 5 列 × 8 行的商品墙，滚动时首尾相连无缝循环。        */
const WCOLS=5, WCW=240, WCH=340, WGX=14, WGY=18, WROWS=8, RAILW=248, WPAD=46;
let WALL=null, WALL_W=0, WALL_H=0;

function buildWall(){
  if(WALL) return WALL;
  const ims=WALL_SRC.map(s=>IM[s]);
  if(!ims.length||!ims.every(i=>i&&i.complete&&i.naturalWidth)) return null;
  const w=WCOLS*WCW+(WCOLS-1)*WGX+WPAD*2, rh=WCH+WGY, h=WROWS*rh;
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const g=cv.getContext('2d'); g.imageSmoothingQuality='high';
  g.fillStyle='#F2F5F2'; g.fillRect(0,0,w,h);
  // 伪随机铺排：相邻上下/左右不重复，滚动时不会出现"同一排复制"感
  let seed=20261126;
  const rnd=()=>{ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; };
  const grid=[];
  for(let r=0;r<WROWS;r++){
    grid[r]=[];
    for(let c=0;c<WCOLS;c++){
      let k=0,tries=0;
      do{ k=Math.floor(rnd()*ims.length); tries++; }
      while(tries<40 && ((r>0&&grid[r-1][c]===k)||(c>0&&grid[r][c-1]===k)));
      grid[r][c]=k;
    }
  }
  for(let r=0;r<WROWS;r++)for(let c=0;c<WCOLS;c++){
    const x=WPAD+c*(WCW+WGX), y=r*rh;
    g.save(); g.beginPath(); g.roundRect(x,y,WCW,WCH,10); g.clip();
    g.fillStyle='#fff'; g.fillRect(x,y,WCW,WCH);
    g.drawImage(ims[grid[r][c]],x,y,WCW,WCH);
    g.restore();
    g.strokeStyle='#E4EAE4'; g.lineWidth=1.4;
    g.beginPath(); g.roundRect(x+.7,y+.7,WCW-1.4,WCH-1.4,10); g.stroke();
  }
  WALL=cv; WALL_W=w; WALL_H=h;
  return cv;
}

/* 滚动位移：静止蓄力 → 加速 → 高速 → 收尾减速，总行程 6000px（≈18 排 / 108 个商品） */
const SC_A=4.92, SC_B=6.38, SC_D=4500;
function scrollAt(t){
  const p=eInOut(clamp((t-SC_A)/(SC_B-SC_A)));
  return SC_D*p;
}
function scrollV(t){ const k=1/120; return (scrollAt(t+k)-scrollAt(t-k))/(2*k); }

/* 单次绘制：把商品墙铺满内容区。dyOff 为屏幕纵向偏移，用于多帧平均做运动模糊 */
function wallFrame(cx,cy,cw,ch,scroll,zoom,alpha,dyOff){
  if(!WALL) return;
  const s=cw/(WALL_W*1.05), z=zoom;   // 预留 5% 余量：推近到最大时左右仍不切卡片
  const W=WALL_W*s*z, H=WALL_H*s*z;
  const D=(((scroll*s*z+dyOff)%H)+H)%H;          // 墙顶边在内容区上方多少 px
  const X=cx+cw/2-W/2, Y=cy+ch/2-(D+ch/2)*z;
  ctx.save(); ctx.globalAlpha*=alpha;

  });

  /* ================= 盒子：预备 → 下落 → 挤压回弹 → 静息呼吸 ================= */
  const BX=1372, BY=748, BW=250, BD=115, BH=210;
  const tA=22.18, tB=22.36, tL=22.74;
  let offY=0, SX=1, SY=1, bA=0;

  if(t<tA){
    bA=0;
  } else if(t<tB){
    // anticipation：悬停上升并被拉长，为下落蓄势
    const a=eOutC(ph(t,tA,tB));
    bA=a; offY=-70-24*a; SX=1-0.035*a; SY=1+0.075*a;
  } else if(t<tL){
    // 加速下落，身体保持拉长
    const p=eInQuad((t-tB)/(tL-tB));
    bA=1; offY=lerp(-94,0,p); SX=1-0.035+0.05*p; SY=1+0.075-0.11*p;
  } else {
    const dt=t-tL;
    bA=1; [SX,SY]=landElastic(dt);
    if(dt>0.55) offY=Math.sin((t-tL)*2.0)*2.4;   // 静息呼吸，幅度极小
  }

  // 地面阴影：高度越高越小越淡（secondary action），落地瞬间加深放大
  if(bA>0){
    const air=clamp(-offY/150);
    const shS=1-air*.52;
    const hit=t>tL? Math.exp(-(t-tL)*9)*.12 : 0;
    ctx.save(); ctx.globalAlpha*=(0.21-air*.16+hit)*bA;
    ctx.fillStyle='#0A2A1B';
    ctx.beginPath(); ctx.ellipse(BX,BY+20,262*shS,40*shS,0,0,7); ctx.fill();
    ctx.restore();
  }

  // 落地涟漪：一圈贴地的绿色扩散（secondary action）
  if(t>tL && t<tL+0.78){
    const rt=(t-tL)/0.78;
    const rr=lerp(170,455,eOutC(rt));
    ctx.save(); ctx.globalAlpha*=(1-rt)*.44;
    ctx.strokeStyle=G.a; ctx.lineWidth=4*(1-rt)+1.2;
    ctx.beginPath(); ctx.ellipse(BX,BY+18,rr,rr*.17,0,0,7); ctx.stroke();
    ctx.restore();
  }

  if(bA>0){
    ctx.save(); ctx.globalAlpha*=bA;
    ctx.translate(BX,BY+offY); ctx.scale(SX,SY);
    isoBox(0,0,BW,BD,BH);

    // 顶面接缝，强化体积
    ctx.save(); ctx.globalAlpha*=.14; ctx.strokeStyle='#052E1B'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(-BW,-BH); ctx.lineTo(0,-BH+BD); ctx.lineTo(BW,-BH); ctx.stroke();
    ctx.restore();

    // 盒面标识：跟随等距透视（v 轴向下，避免图像翻转）
    const lg=ph(t,tL+0.26,tL+0.62);
    if(lg>0){
      const t2=tint(MARK,'#FFFFFF');
      if(t2){
        const pop=lg<1? eOutBack(lg) : 1;
        const k=108*clamp(pop), uw=k/BW, uh=k/BH;
        ctx.save();
        ctx.globalAlpha*=clamp(lg*2.2);
        ctx.transform(BW,-BD,0,BH,0,BD-BH);   // u:左→右, v:上→下
        ctx.translate(0.50,0.45); ctx.scale(pop,pop);
        ctx.drawImage(t2,-uw/2,-uh/2,uw,uh);
        ctx.restore();
      }
    }
    ctx.restore();
  }

  /* ================= 吊牌：钟摆落下（follow-through） ================= */
  const tp=ph(t,23.16,23.92);
  if(tp>0){
    const sway=t>23.94? .075*Math.sin((t-23.94)*7.0)*Math.exp(-(t-23.94)*3.6) : 0;
    const rot=-0.075 + (1-eOutC(tp))*(-0.26) + sway;
    const px=985, py=652;
    // 吊绳
    ctx.save(); ctx.globalAlpha*=clamp(tp*1.6);
    ctx.strokeStyle='#B7C8BD'; ctx.lineWidth=2.4; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(1130,542); ctx.quadraticCurveTo(1075,566,px+4,py);
    ctx.stroke(); ctx.restore();

    ctx.save(); ctx.globalAlpha*=clamp(tp*1.5);
    ctx.translate(px,py); ctx.rotate(rot); ctx.translate(0,(1-eOutQ(tp))*-46);
    shadow(-85,-14,170,246,10,26,.15,12);
    ctx.fillStyle='#fff'; ctx.beginPath();
    ctx.moveTo(-85,10); ctx.lineTo(0,-14); ctx.lineTo(85,10); ctx.lineTo(85,232); ctx.lineTo(-85,232); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(0,30,8,0,7); ctx.fillStyle=G.light; ctx.fill();
    stroke(-1,29,2,2,'#C9D8CE',1.6,4);
    logoWord(0,96,124,G.ink);
    R(-38,124,76,1.4,G.line);
    text('$33.30',0,176,28,G.b,{align:'center',weight:800,italic:true,family:'Arial Black,Arial,sans-serif'});
    text('SHIPPED IN YOUR BOX',0,205,9,G.muted,{align:'center',weight:700,ls:1.2});
    ctx.restore();
  }

  /* ================= 感谢卡 ================= */
  const cp=ph(t,23.52,24.28);
  if(cp>0){
    const crot=-0.048 + (1-eOutC(cp))*(-0.10);
    ctx.save(); ctx.globalAlpha*=clamp(cp*1.4);
    ctx.translate(700,892); ctx.rotate(crot); ctx.translate((1-eOutC(cp))*-96,0);
    shadow(-150,-89,300,178,10,30,.15,12);
    R(-150,-89,300,178,'#fff',10);
    ctx.save(); ctx.beginPath(); ctx.roundRect(-150,-89,300,178,10); ctx.clip();
    R(-150,-89,300,9,G.a); ctx.restore();
    text('THANK YOU',0,-20,21,G.ink,{align:'center',weight:800,ls:3.2});
    text('for shopping small',0,10,13.5,G.muted,{align:'center',weight:500});
    R(-42,30,84,1.4,'#E2EAE4');
    logoWord(0,60,112,G.b);
    ctx.restore();
  }

  const np=eOutC(ph(t,24.20,24.90));
  text('▲ 占位图形 · 待替换为实物试拍（盒 / 吊牌 / 感谢卡）',142,1048,12,'#A6B9AE',{weight:500,alpha:np*.75});
}

/* 8 — collab */
function sCollab(t){
  bgLight(t);
  const q=eOutC(ph(t,27.1,27.8));
  head('Your team. Our factory.',960,146,58,G.ink,{align:'center',alpha:q});
  text('Same screen, same files, same approvals.',960,192,22,G.ink2,{align:'center',weight:500,alpha:eOutC(ph(t,27.4,28.1))});

  const p=eOutQ(ph(t,27.0,27.7));
  const w=1320,h=576,x=960-w/2,y=252;
  appWindow(x,y,w,h,clamp(p*1.5),['Brand kit','Products','Orders'],0);

  const tiles=[
    ['assets/p/1.png','Scarf · AOP',0],
    ['assets/p/2.png','Shawl · AOP',1],
    ['assets/p/m1.png','Crewneck',2],
    ['assets/p/m2.png','Bodysuit',3],
  ];
  const tw4=272, gap4=24, total4=tiles.length*tw4+(tiles.length-1)*gap4, x04=x+(w-total4)/2;
  tiles.forEach((it,i)=>{
    const ap=eOutC(clamp((t-27.25-i*.06)/.5));
    const tx2=x04+i*(tw4+gap4), ty2=y+110+(1-ap)*22;
    ctx.save(); ctx.globalAlpha*=ap;
    R(tx2,ty2,tw4,310,'#F6FAF7',14);
    imgFit(IM[it[0]],tx2+14,ty2+14,tw4-28,250,10);
    text(it[1],tx2+14,ty2+294,14,G.muted,{weight:500});
    ctx.restore();
  });

  // palette
  const cols=['#0A2A1B','#32CA49','#F2C14E','#E06A4A','#4589EF'];
  const palY=y+h-72;
  cols.forEach((cc,i)=>{
    const cx2=x04+i*54;
    R(cx2,palY,38,38,cc,11);
    stroke(cx2,palY,38,38,'rgba(0,0,0,.10)',1.5,11);
    if(i===1){
      const s2=ph(t,28.0,28.4);
      if(s2>0){ ctx.save(); ctx.globalAlpha*=s2; stroke(cx2-5,palY-5,48,48,G.ink,2.5,14); ctx.restore(); }
    }
  });
  text('Brand palette',x04+cols.length*54+16,palY+26,15,G.muted,{weight:500});

  // cursors
  const m1=eInOut(ph(t,27.4,28.35));
  const cx1=lerp(x+w-120,x04+156,m1), cy1=lerp(y+h-120,y+286,m1);
  const m2=eInOut(ph(t,27.55,28.5));
  const cx2=lerp(x+w-80,x04+380,m2), cy2=lerp(y+h-90,y+290,m2);
  cursor(cx2,cy2,'#4589EF',1,1.0);
  ctx.save(); ctx.globalAlpha*=.95; R(cx2+20,cy2+36,84,26,'#4589EF',13);
  text('Mia',cx2+62,cy2+54,13,'#fff',{align:'center',weight:700}); ctx.restore();
  cursor(cx1,cy1,G.b,1,1.1);
  ctx.save(); ctx.globalAlpha*=.95; R(cx1+20,cy1+36,96,26,G.b,13);
  text('You',cx1+68,cy1+54,13,'#fff',{align:'center',weight:700}); ctx.restore();

  // selection ring around first tile
  const dp=ph(t,28.1,28.5);
  if(dp>0){
    ctx.save(); ctx.globalAlpha*=1-dp*.75; ctx.strokeStyle=G.a; ctx.lineWidth=4;
    ctx.beginPath(); ctx.roundRect(x04+6,y+104,tw4+12,322,16); ctx.stroke(); ctx.restore();
  }
  // approved bubble
  const ab=ph(t,28.35,28.8);
  if(ab>0){
    ctx.save(); ctx.globalAlpha*=eOutC(ab); ctx.translate(0,(1-eOutC(ab))*14);
    const axb=x04+112, ayb=y+378;
    shadow(axb,ayb,152,40,20,20,.16,8);
    R(axb,ayb,152,40,'#0A2A1B',20);
    R(axb+10,ayb+9,22,22,G.a,11); check(axb+21,ayb+20,13,'#06301C');
    text('Approved',axb+40,ayb+26,14,'#fff',{weight:600});
    ctx.restore();
  }
}

/* 9 — close */
function sClose(t){
  bgGradient(t+10);
  const p=eOutC(ph(t,29.2,29.75));
  ctx.save(); ctx.globalAlpha*=p;
  ctx.translate(0,(1-p)*20);
  logoWord(960,498,740,'#FFFFFF');
  text('FREE TO START · NO MOQ · 5–15 DAY SHIPPING',960,664,22,'rgba(255,255,255,.9)',{align:'center',weight:700,ls:4});
  R(820,706,280,1.5,'rgba(255,255,255,.5)');
  text('eprolo.com',960,764,34,'#fff',{align:'center',weight:700,ls:1});

/* ================= RENDER ================= */

function draw(t){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(t<1.60) sBrand(t);
  else if(t<4.40) sChannels(t);
  else if(t<8.60) sWindow(t);
  else if(t<9.60) sRing(t);
  else if(t<14.20) sBulk(t);
  else if(t<18.00) sSource(t);
  else if(t<22.00) sMargin(t);
  else if(t<27.00) sKit(t);
  else if(t<29.20) sCollab(t);
  else sClose(t);
  ctx.restore();

  // global vignette for cohesion
  const vg=ctx.createRadialGradient(960,540,520,960,540,1180);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,20,10,.16)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
}

/* ---------- video sync ---------- */
const vidPlan=[];
function syncVideos(t,playing){
  vidPlan.forEach(pl=>{
    const on = t>=pl.from-0.15 && t<=pl.to+0.2;
    const target = pl.start + (t-pl.from)*pl.speed;
    if(!on){ if(!pl.v.paused) pl.v.pause(); pl.v.dataset.on='0'; return; }
    pl.v.dataset.on='1';
    if(playing){
      if(pl.v.paused){ try{pl.v.currentTime=clamp(target,0,pl.v.duration||9)}catch(e){} pl.v.play().catch(()=>{}); }
      if(Math.abs(pl.v.currentTime-target)>0.34){ try{pl.v.currentTime=clamp(target,0,pl.v.duration||9)}catch(e){} }
    } else {
      if(!pl.v.paused) pl.v.pause();
      if(Math.abs(pl.v.currentTime-target)>0.05){ try{pl.v.currentTime=clamp(target,0,pl.v.duration||9)}catch(e){} }
    }
  });
}

/* ---------- player ---------- */
let t=0, playing=true, last=performance.now();
const fill=document.getElementById('fill'), bar=document.getElementById('bar'),
      timeEl=document.getElementById('time'), playBtn=document.getElementById('play');

function fmt(s){ return s.toFixed(2).padStart(5,'0'); }
function tick(now){
  const dt=(now-last)/1000; last=now;
  if(playing){ t+=dt; if(t>END){ t=PLAYLOOP?0:END; } }
  syncVideos(t,playing);
  draw(Math.min(t,END-0.001));
  fill.style.width=(t/END*100)+'%';
  timeEl.textContent=fmt(t)+' / '+fmt(END);
  requestAnimationFrame(tick);
}
const params=new URLSearchParams(location.search);
const PLAYLOOP = params.get('loop')==='1';
if(params.has('t')){ t=parseFloat(params.get('t')); playing=false; }
if(params.has('still')){ t=parseFloat(params.get('still')); playing=false; document.getElementById('hud').style.display='none'; }

bar.addEventListener('click',e=>{
  const r=bar.getBoundingClientRect(); t=clamp((e.clientX-r.left)/r.width)*END; last=performance.now();
});
playBtn.addEventListener('click',()=>{
  playing=!playing; playBtn.textContent=playing?'❚❚':'▶'; last=performance.now();
});
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){ e.preventDefault(); playing=!playing; playBtn.textContent=playing?'❚❚':'▶'; last=performance.now(); }
  if(e.code==='ArrowRight'){ t=Math.min(END,t+1/30); }
  if(e.code==='ArrowLeft'){ t=Math.max(0,t-1/30); }
  if(/^Digit[0-9]$/.test(e.code)){ const i=+e.code.slice(5); if(S[i]) t=S[i].t; }
});

// chapters + marks
const chap=document.getElementById('chapters'), marks=document.getElementById('marks');
S.forEach((s,i)=>{
  const b=document.createElement('button');
  b.textContent=(i+1)+' '+s.n; b.onclick=()=>{ t=s.t+.01; last=performance.now(); };
  chap.appendChild(b);
  const m=document.createElement('div'); m.className='mk'; m.style.left=(s.t/END*100)+'%';
  marks.appendChild(m);
});

playBtn.textContent='❚❚';

const EXPORT = params.has('export');
if(EXPORT){
  document.getElementById('hud').style.display='none';
  document.getElementById('hint').style.display='none';
  // 供逐帧导出调用：给定时间点立刻画一帧，不依赖 requestAnimationFrame
  window.__frame=(tt)=>{ draw(Math.max(0,Math.min(tt,END-0.0012))); return 1; };
  window.__imgsReady=()=>[...P.map(s=>IM[s]),MARK,LOCKUP].every(i=>i&&i.complete&&i.naturalWidth>0);
  window.__ready=true;
}

const STILL = params.has('still');
if(STILL){
  document.getElementById('hud').style.display='none';
  document.getElementById('hint').style.display='none';
  const paint=()=>{ syncVideos(t,false); draw(Math.min(t,END-0.001)); };
  paint();
  window.addEventListener('load',paint);
  [120,400,900,1600].forEach(ms=>setTimeout(paint,ms));
} else if(!EXPORT){
  window.__ready=true;
  requestAnimationFrame(tick);
}
</script>
